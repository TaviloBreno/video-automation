<!DOCTYPE html>
<html data-composition-variables='[]'>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --palettePrimary: #FE2C55;
      --paletteAccent: #25F4EE;
      --paletteText: #FFFFFF;
      --paletteBackground: #000000;
    }
    body { margin: 0; background: var(--paletteBackground); }
    #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" 
       data-width="1080" data-height="1920" data-duration="15.525">
    
    <div id="el-0" class="clip" 
         data-start="0.0" data-duration="4" 
         data-animation="fade"
         style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); 
                color:var(--paletteText); font-size:64px; text-align:center; width:90%;">
      LANçAMENTO
    </div>

    <div id="el-1" class="clip" 
         data-start="4.0" data-duration="3" 
         data-animation="slide-up"
         style="position:absolute; top:85%; left:50%; transform:translate(-50%,-50%); 
                color:var(--paletteText); font-size:64px; text-align:center; width:90%;">
      Conheº o novo produto
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="animations/animations.js"></script>
    <script>
    window.HF_ANIMATIONS = {
      "fade-in": (el, tl, at) => { tl.from(el, { opacity: 0, duration: 0.4, ease: "power2.out" }, at); },
      "slide-up": (el, tl, at) => { tl.from(el, { y: 150, opacity: 0, ease: "power4.out", duration: 0.6 }, at); },
      "slide-left": (el, tl, at) => { tl.from(el, { x: -200, opacity: 0, ease: "power4.out", duration: 0.6 }, at); },
      "scale-in": (el, tl, at) => { tl.from(el, { scale: 0, opacity: 0, duration: 0.6, ease: "power2.out" }, at); },
      "typewriter": (el, tl, at) => {
        el.style.overflow = "hidden"; el.style.whiteSpace = "nowrap";
        tl.from(el, { width: 0, duration: 1.2, ease: "steps(20)" }, at);
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    document.querySelectorAll("[data-animation]").forEach((el) => {
      const recipe = window.HF_ANIMATIONS && window.HF_ANIMATIONS[el.dataset.animation];
      if (recipe) recipe(el, tl, parseFloat(el.dataset.start || "0"));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
