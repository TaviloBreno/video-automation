<!DOCTYPE html>
<html data-composition-variables='[]'>
<head>
  <meta charset="utf-8">
  <title>Widescreen Studio Scene</title>
  <style>
    :root {
      --palettePrimary: {{PALETTE_PRIMARY}};
      --paletteAccent: {{PALETTE_ACCENT}};
      --paletteText: {{PALETTE_TEXT}};
      --paletteBackground: {{PALETTE_BACKGROUND}};
      --surface: color-mix(in srgb, var(--paletteBackground) 88%, white);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paletteBackground);
      color: var(--paletteText);
      font-family: 'Outfit', Inter, -apple-system, sans-serif;
      overflow: hidden;
    }
    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 15%, color-mix(in srgb, var(--paletteAccent) 22%, transparent) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, color-mix(in srgb, var(--palettePrimary) 18%, transparent) 0%, transparent 45%),
        linear-gradient(135deg, var(--paletteBackground) 0%, var(--surface) 100%);
    }

    /* Grade Científica de Fundo e Moldura Neon */
    .bg-grid-overlay {
      position: absolute;
      inset: 0;
      background-size: 60px 60px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      pointer-events: none;
    }
    .hud-border {
      position: absolute;
      inset: 36px;
      border: 1px solid color-mix(in srgb, var(--palettePrimary) 22%, transparent);
      pointer-events: none;
    }
    .hud-header {
      position: absolute;
      top: 56px;
      left: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--paletteAccent);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .hud-dot {
      width: 10px;
      height: 10px;
      background: var(--paletteAccent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--paletteAccent);
    }

    /* Container de Cada Clipe / Slide */
    .explainer-clip {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 120px 100px 90px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Coluna Esquerda: Texto e Tipografia Cinética */
    .clip-left-content {
      flex: 1;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 2;
    }

    .clip-heading {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      color: var(--paletteAccent);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .clip-index {
      display: inline-flex;
      width: 48px;
      height: 48px;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--paletteAccent);
      border-radius: 50%;
      font-size: 18px;
      color: var(--paletteAccent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--paletteAccent) 40%, transparent);
    }

    .clip-copy {
      font-size: 54px;
      font-weight: 750;
      line-height: 1.2;
      color: var(--paletteText);
      text-wrap: balance;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .clip-sources {
      margin-top: 10px;
      color: color-mix(in srgb, var(--paletteText) 65%, transparent);
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: .5px;
    }
    .citation b { color: var(--palettePrimary); }
    .citation i { font-style: normal; opacity: 0.8; }

    /* Coluna Direita: Imagem Real ou Motion Design Procedural */
    .clip-right-media {
      flex: 0 0 680px;
      height: 480px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Mídia: Imagem Fotográfica com Créditos */
    .media-image-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid color-mix(in srgb, var(--paletteAccent) 40%, transparent);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), 0 0 30px color-mix(in srgb, var(--paletteAccent) 20%, transparent);
      background: #000;
    }
    .media-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center center;
    }
    .image-credit-badge {
      position: absolute;
      bottom: 14px;
      right: 16px;
      background: rgba(8, 12, 22, 0.85);
      backdrop-filter: blur(10px);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .image-credit-badge b {
      color: var(--palettePrimary);
    }

    /* Mídia: Motion Design Vetorial Procedural Temático */
    .motion-design-graphic {
      position: relative;
      width: 460px;
      height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1. Tema Astronomia / Buracos Negros / Quasars */
    .motion-astro .plasma-jet {
      position: absolute;
      width: 6px;
      height: 400px;
      background: linear-gradient(to bottom, transparent, var(--paletteAccent), #ffffff, var(--paletteAccent), transparent);
      box-shadow: 0 0 25px var(--paletteAccent);
      border-radius: 3px;
      z-index: 1;
    }
    .motion-astro .accretion-disk {
      position: absolute;
      border-radius: 50%;
      border: 3px solid color-mix(in srgb, var(--palettePrimary) 70%, transparent);
      box-shadow: 0 0 40px var(--palettePrimary), inset 0 0 30px var(--paletteAccent);
      transform: rotateX(68deg);
    }
    .motion-astro .disk-outer { width: 420px; height: 420px; }
    .motion-astro .disk-inner { width: 260px; height: 260px; border-style: dashed; }
    .motion-astro .event-horizon {
      position: absolute;
      width: 140px;
      height: 140px;
      background: #000000;
      border-radius: 50%;
      box-shadow: 0 0 24px var(--paletteAccent), 0 0 60px color-mix(in srgb, var(--palettePrimary) 40%, transparent);
      border: 2px solid rgba(255, 255, 255, 0.4);
      z-index: 2;
    }

    /* 2. Tema Biologia / Células / Câncer / DNA / Imunoterapia */
    .motion-bio .cell-membrane {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 2px dashed color-mix(in srgb, var(--palettePrimary) 60%, transparent);
      background: radial-gradient(circle, color-mix(in srgb, var(--palettePrimary) 12%, transparent) 0%, transparent 70%);
      box-shadow: 0 0 35px color-mix(in srgb, var(--palettePrimary) 25%, transparent);
    }
    .motion-bio .dna-helix {
      position: absolute;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .motion-bio .dna-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--paletteAccent);
      box-shadow: 0 0 20px var(--paletteAccent);
    }
    .motion-bio .ring-a { width: 240px; height: 160px; transform: rotate(35deg); }
    .motion-bio .ring-b { width: 240px; height: 160px; transform: rotate(-35deg); border-style: dashed; }
    .motion-bio .cell-nucleus {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, var(--palettePrimary) 45%, color-mix(in srgb, var(--paletteAccent) 70%, transparent) 85%);
      box-shadow: 0 0 45px var(--palettePrimary), 0 0 75px var(--paletteAccent);
      z-index: 2;
    }

    /* 3. Tema Rede Neural / IA / Tecnologia */
    .motion-neural .neural-grid {
      position: absolute;
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .motion-neural .neural-core {
      position: absolute;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, var(--paletteAccent) 0%, var(--palettePrimary) 70%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 50px var(--paletteAccent);
    }
    .motion-neural .synapse-orbit {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed color-mix(in srgb, var(--palettePrimary) 50%, transparent);
    }
    .motion-neural .syn-1 { width: 340px; height: 340px; }
    .motion-neural .syn-2 { width: 220px; height: 220px; }

    /* 4. Tema Física Quântica / Átomos */
    .motion-quantum .quantum-orbit {
      position: absolute;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--paletteAccent) 60%, transparent);
      box-shadow: 0 0 25px color-mix(in srgb, var(--paletteAccent) 20%, transparent);
    }
    .motion-quantum .q-1 { width: 380px; height: 140px; transform: rotate(0deg); }
    .motion-quantum .q-2 { width: 380px; height: 140px; transform: rotate(60deg); }
    .motion-quantum .q-3 { width: 380px; height: 140px; transform: rotate(120deg); }
    .motion-quantum .quantum-nucleus {
      position: absolute;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ffffff 0%, var(--palettePrimary) 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 45px var(--palettePrimary);
      z-index: 2;
    }

    /* Anéis Procedurais Gerais */
    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px dashed color-mix(in srgb, var(--palettePrimary) 45%, transparent);
    }
    .ring-outer {
      width: 420px;
      height: 420px;
      border-color: color-mix(in srgb, var(--paletteAccent) 50%, transparent);
      box-shadow: 0 0 30px color-mix(in srgb, var(--paletteAccent) 15%, transparent);
    }
    .ring-mid {
      width: 300px;
      height: 300px;
      border-style: solid;
      border-width: 1px;
      border-color: color-mix(in srgb, var(--palettePrimary) 40%, transparent);
    }
    .ring-inner {
      width: 180px;
      height: 180px;
      border: 2px dashed color-mix(in srgb, var(--palettePrimary) 70%, transparent);
    }
    .pulse-core {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, var(--palettePrimary) 0%, color-mix(in srgb, var(--paletteAccent) 60%, transparent) 70%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 50px var(--palettePrimary), 0 0 90px var(--paletteAccent);
    }
    .hud-label {
      position: absolute;
      bottom: -16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--palettePrimary);
      background: rgba(4, 7, 16, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid color-mix(in srgb, var(--palettePrimary) 40%, transparent);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0"
       data-width="1920" data-height="1080" data-duration="{{SCENE_DURATION}}">
    <div class="bg-grid-overlay"></div>
    <div class="hud-border"></div>
    <div class="hud-header">
      <span class="hud-dot"></span>
      <span>ESTÚDIO DE CIÊNCIA & EXPLICAÇÃO VISUAL</span>
    </div>

    {{CLIPS}}
  </div>

  <!-- GSAP Carregado Localmente Offline -->
  <script src="src/gsap.min.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const tl = gsap.timeline({ paused: true });
      const clips = document.querySelectorAll(".explainer-clip");

      clips.forEach((el, idx) => {
        const start = parseFloat(el.dataset.start || "0");
        const dur = parseFloat(el.dataset.duration || "4");
        const leftContent = el.querySelector(".clip-left-content");
        const rightMedia = el.querySelector(".clip-right-media");
        const img = el.querySelector(".media-image-frame img");
        const ringOuter = el.querySelector(".ring-outer");
        const ringInner = el.querySelector(".ring-inner");
        const core = el.querySelector(".pulse-core");

        // 1. Torna o clipe visível no segundo exato de início
        tl.set(el, { autoAlpha: 1, visibility: "visible" }, start);

        // 2. Animação Cinética de Entrada
        if (leftContent) {
          tl.from(leftContent, {
            y: 50,
            opacity: 0,
            duration: 0.65,
            ease: "power3.out"
          }, start);
        }
        if (rightMedia) {
          tl.from(rightMedia, {
            scale: 0.88,
            opacity: 0,
            duration: 0.75,
            ease: "back.out(1.4)"
          }, start + 0.1);
        }

        // 3. Movimento Contínuo (Ken Burns ou Motion Design Temático)
        if (img) {
          tl.fromTo(img, { scale: 1.0 }, { scale: 1.07, duration: dur, ease: "none" }, start);
        }
        if (ringOuter) {
          tl.fromTo(ringOuter, { rotation: 0 }, { rotation: 220, duration: dur, ease: "none" }, start);
        }
        if (ringInner) {
          tl.fromTo(ringInner, { rotation: 0 }, { rotation: -300, duration: dur, ease: "none" }, start);
        }
        if (core) {
          tl.fromTo(core, { scale: 0.9 }, { scale: 1.15, yoyo: true, repeat: Math.ceil(dur), duration: 0.9, ease: "sine.inOut" }, start);
        }

        // Animações Temáticas Específicas
        const astroDisk = el.querySelector(".accretion-disk");
        if (astroDisk) {
          tl.fromTo(astroDisk, { rotation: 0 }, { rotation: 360, duration: dur, ease: "none" }, start);
        }
        const plasmaJet = el.querySelector(".plasma-jet");
        if (plasmaJet) {
          tl.fromTo(plasmaJet, { scaleY: 0.9, opacity: 0.8 }, { scaleY: 1.1, opacity: 1, yoyo: true, repeat: Math.ceil(dur * 2), duration: 0.6, ease: "sine.inOut" }, start);
        }
        const dnaA = el.querySelector(".ring-a");
        const dnaB = el.querySelector(".ring-b");
        if (dnaA && dnaB) {
          tl.fromTo(dnaA, { rotation: 35 }, { rotation: 215, duration: dur, ease: "none" }, start);
          tl.fromTo(dnaB, { rotation: -35 }, { rotation: -215, duration: dur, ease: "none" }, start);
        }
        const cellMembrane = el.querySelector(".cell-membrane");
        if (cellMembrane) {
          tl.fromTo(cellMembrane, { scale: 0.96 }, { scale: 1.04, yoyo: true, repeat: Math.ceil(dur), duration: 1.4, ease: "sine.inOut" }, start);
        }
        const qOrbits = el.querySelectorAll(".quantum-orbit");
        qOrbits.forEach((qOrb, qIdx) => {
          const dir = qIdx % 2 === 0 ? 1 : -1;
          tl.fromTo(qOrb, { rotation: qIdx * 60 }, { rotation: qIdx * 60 + 360 * dir, duration: dur, ease: "none" }, start);
        });

        // 4. Animação de Saída Suave antes de trocar para o próximo clipe
        const exitStart = Math.max(start + 0.3, start + dur - 0.45);
        tl.to(el, {
          opacity: 0,
          y: -25,
          duration: 0.4,
          ease: "power2.in"
        }, exitStart);

        // 5. Oculta completamente após o término da sua duração
        tl.set(el, { autoAlpha: 0, visibility: "hidden" }, start + dur);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    });
  </script>
</body>
</html>
